name: Golden Path

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily run at 12:00 UTC so upstream AI / Supabase regressions surface within 24h.
  schedule:
    - cron: '0 12 * * *'
  # Hand-run button in the Actions tab.
  workflow_dispatch:

concurrency:
  group: golden-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- 1. Build is the cheapest layer; fail fast if tsc/vite is broken. ---
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  # --- 2. Deterministic flows (no AI dependency). Must always be green. ---
  deterministic:
    name: Deterministic Golden Paths
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flow:
          - messaging
          - proposal
          - equipment-schedule
          - rls
          - content-ops
          - quality-controls
          - static-integrity
          - mobile
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run Golden Path (${{ matrix.flow }})
        run: bun scripts/golden-path-${{ matrix.flow }}.ts

  # --- 3. AI-dependent flows. Allowed to flake once (transient Gemini/Claude
  # 500s shouldn't red-bar the whole suite on every deploy), but must still
  # pass within 3 tries. If the third attempt fails, something real is
  # broken. ---
  ai-dependent:
    name: AI-dependent Golden Paths
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: core          # the canonical auth→seed→publish→invoice→portal
            script: scripts/golden-path.ts
          - flow: ai-writing
            script: scripts/golden-path-ai-writing.ts
          - flow: learning
            script: scripts/golden-path-learning.ts
          - flow: photos        # Gemini vision — allow up to 3 attempts for model load spikes
            script: scripts/golden-path-photos.ts
          - flow: wizard        # tests 48-50 all call AI (seed-report-from-notes, daily-brief, ai-edit)
            script: scripts/golden-path-wizard.ts
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run Golden Path (${{ matrix.flow }}) with retries
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if bun ${{ matrix.script }}; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; sleeping 20s before retry…"
            sleep 20
          done
          echo "All 3 attempts failed — a real regression, not AI flake."
          exit 1
