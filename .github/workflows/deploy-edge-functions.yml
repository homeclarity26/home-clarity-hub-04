name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy changed functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions (changed only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: vvwojahsianpmwjvkunn
        run: |
          set -e
          # Find functions whose files changed in the push
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '^supabase/functions/[^/_]+/' | \
            awk -F/ '{print $3}' | sort -u)
          # If _shared/ changed, redeploy EVERYTHING (since every function
          # bundles its own copy of _shared at deploy time).
          SHARED=$(git diff --name-only HEAD^ HEAD | grep -c '^supabase/functions/_shared/' || true)
          if [ "$SHARED" != "0" ]; then
            echo "_shared/ changed — redeploying all functions"
            CHANGED=$(ls supabase/functions | grep -v '^_' | grep -v '\.ts$')
          fi
          if [ -z "$CHANGED" ]; then
            echo "No edge functions changed."; exit 0
          fi
          for fn in $CHANGED; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "::group::Deploying $fn"
              supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
              echo "::endgroup::"
            fi
          done
