:root {
  --navy: #0A1628;

  --gold-light: #D4A574;

  --white: #FFFFFF;
  --rust: #B7410E;
  --text: #0A1628;
  --text-muted: #6B6B6B;
  --text-subtle: #999999;
  --border: #E5E0D6;
  --border-strong: #C9C2B5;
  --success: #2F6E40;
  --warning: #B58A1F;
  --danger: #B7410E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--cream);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.font-display { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: -0.01em; }
.font-mono { font-family: 'IBM Plex Mono', monospace; }
.uppercase { text-transform: uppercase; letter-spacing: 0.12em; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; }
textarea { resize: vertical; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 6px;
  font-size: 13px; font-weight: 500;
  transition: all 0.15s;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn-primary { background: var(--navy); color: var(--cream); }
.btn-primary:hover { background: var(--navy-soft); }
.btn-gold { background: var(--gold); color: var(--white); }
.btn-gold:hover { background: var(--gold-light); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
.btn-ghost:hover { background: var(--cream-light); }
.btn-rust { background: var(--rust); color: var(--white); }
.btn-rust:hover { background: #9B370B; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-xs { padding: 4px 10px; font-size: 11px; }
.shimmer {
  background: linear-gradient(90deg, var(--cream-light) 0%, var(--border) 50%, var(--cream-light) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.fadein { animation: fadein 0.4s ease-out; }
@keyframes fadein {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
.scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* AI Expand button styling - appears on every text field */
.ai-expand-wrap { position: relative; }
.ai-expand-btn {
  position: absolute; top: 6px; right: 6px;
  background: var(--gold); color: white;
  font-size: 10px; padding: 3px 8px; border-radius: 3px;
  display: flex; align-items: center; gap: 4px;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.08em; text-transform: uppercase;
  opacity: 0.85;
}
.ai-expand-btn:hover { opacity: 1; }
.ai-expand-btn::before { content: '✦'; font-size: 11px; }

/* Tier card stretch behavior */
.tier-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  align-items: stretch;
}
.tier-grid > * { display: flex; flex-direction: column; }
</style>

// AIExpandTextArea — implements [v2.23] AI content expansion as core editing pattern
const AIExpandTextArea = ({ label, defaultValue, rows = 4, expandedDemo, onExpand }) => {
  const [value, setValue] = useState(defaultValue);
  const [expanding, setExpanding] = useState(false);
  const [tightening, setTightening] = useState(false);
  const handleExpand = () => {
    setExpanding(true);
    setTimeout(() => {
      setValue(expandedDemo || (defaultValue + "\n\n[AI-expanded] The space carries unmistakable presence — every detail considered, every surface deliberate. The materials reward close inspection, and the proportions feel right whether you're moving through quickly or pausing to take it in. This isn't a room that fades into the background of daily life. It anchors it."));
      setExpanding(false);
      if (onExpand) onExpand();
    }, 1400);
  };
  const handleTighten = () => {
    setTightening(true);
    setTimeout(() => {
      const sentences = value.split(/\.\s+/);
      setValue(sentences.slice(0, Math.max(2, Math.floor(sentences.length / 2))).join('. ') + (sentences.length > 1 ? '.' : ''));
      setTightening(false);
    }, 900);
  };
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <span style={{ fontSize: 11, color: "var(--text-muted)" }}>{label}</span>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={handleExpand} disabled={expanding} className="ai-expand-btn" style={{ position: "static", opacity: expanding ? 0.5 : 0.85 }}>
            {expanding ? "Expanding..." : "Expand with AI"}
          </button>
          <button onClick={handleTighten} disabled={tightening} className="ai-expand-btn" style={{ position: "static", opacity: tightening ? 0.5 : 0.85, background: "var(--navy-soft)" }}>
            {tightening ? "Tightening..." : "Tighten"}
          </button>
        </div>
      </div>
      <textarea
        value={value}
        onChange={(e) => setValue(e.target.value)}
        rows={Math.max(rows, Math.ceil(value.length / 80))}
        style={{
          width: "100%", padding: "10px 12px", fontSize: 13,
          border: "1px solid var(--border)", borderRadius: 4, lineHeight: 1.6,
          fontFamily: "inherit", minHeight: rows * 24,
        }}
      />
    </div>
  );
};

// ─── STEP 2 TOC ─── per [v2.6] custom sections + custom pages
const Step2TOC = ({ onNext, onBack, isMobile }) => {
  const [toc, setToc] = useState(buildInitialTOC);
  const [showCustomDialog, setShowCustomDialog] = useState(null);

  const togglePage = (sIdx, pIdx) => {
    const next = toc.map((s, i) => i !== sIdx ? s : ({ ...s, pages: s.pages.map((p, j) => j !== pIdx ? p : ({ ...p, included: !p.included })) }));
    setToc(next);
  };

  const addCustomPage = (sectionIdx, title) => {
    const next = [...toc];
    next[sectionIdx].pages.push({ id: "custom_" + Date.now(), title, included: true, note: "Custom page", custom: true });
    setToc(next);
    setShowCustomDialog(null);
  };

  const addCustomSection = (label) => {
    setToc([...toc, { label, pages: [], custom: true }]);
    setShowCustomDialog(null);
  };

  const totalPages = toc.reduce((sum, s) => sum + s.pages.filter(p => p.included).length, 0);

  return (
    <div style={{ padding: isMobile ? "20px 16px" : "40px 60px", maxWidth: 1200 }}>
      <Section title="Proposed Table of Contents" eyebrow="Step 2 of 5" action={
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn btn-ghost" onClick={onBack}>← Back</button>
          <button className="btn btn-primary" onClick={onNext}>Approve & Author Pages →</button>
        </div>
      }>
        <p style={{ color: "var(--text-muted)", maxWidth: 720, marginBottom: 12 }}>
          AI proposed every page based on what it found. All pages pull from premade templates — toggle off anything you don't want, add custom pages, create custom sections, or rearrange. <strong>{totalPages} pages</strong> currently included.
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => setShowCustomDialog("section")} className="btn btn-ghost btn-sm">+ Add Custom Section</button>
          <button onClick={() => setShowCustomDialog("page")} className="btn btn-ghost btn-sm">+ Add Custom Page</button>
          <span style={{ fontSize: 11, color: "var(--text-muted)", alignSelf: "center", marginLeft: 8 }}>Templates DB: 65 page templates · 4 section templates</span>
        </div>
      </Section>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: 12, marginBottom: 32 }}>
        {toc.map((s, i) => (
          <div key={s.label} style={{ background: "white", border: "1px solid " + (s.custom ? "var(--gold)" : "var(--border)"), borderRadius: 8, padding: "16px 18px" }}>
            <div className="font-mono uppercase" style={{ fontSize: 10, color: "var(--gold)", marginBottom: 4 }}>
              Section {i + 1} {s.custom && "· Custom"}
            </div>
            <div className="font-display" style={{ fontSize: 18, color: "var(--navy)", marginBottom: 4 }}>{s.label}</div>
            <div style={{ fontSize: 11, color: "var(--text-muted)" }}>{s.pages.filter(p => p.included).length} of {s.pages.length} pages included</div>
          </div>
        ))}
      </div>

      {toc.map((section, sectionIdx) => (
        <div key={section.label} style={{ marginBottom: 32 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
            <h3 className="font-display" style={{ fontSize: 22, color: "var(--navy)" }}>{section.label}</h3>
            <Pill color="cream">{section.pages.filter(p => p.included).length} included</Pill>
            {section.custom && <Pill color="gold">Custom</Pill>}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fill, minmax(280px, 1fr))", gap: 8 }}>
            {section.pages.map((page, pageIdx) => (
              <button key={page.id} onClick={() => togglePage(sectionIdx, pageIdx)} style={{
                textAlign: "left",
                background: page.included ? "white" : "transparent",
                border: page.included ? "1px solid " + (page.custom ? "var(--gold)" : "var(--gold)") : "1px dashed var(--border-strong)",
                borderRadius: 6, padding: "10px 12px",
                display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8,
                opacity: page.included ? 1 : 0.55,
              }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontWeight: 500, color: "var(--navy)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {page.title} {page.custom && "✦"}
                  </div>
                  {page.note && <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 2 }}>{page.note}</div>}
                </div>
                <div style={{
                  width: 18, height: 18, borderRadius: 4,
                  background: page.included ? "var(--gold)" : "transparent",
                  border: "1px solid " + (page.included ? "var(--gold)" : "var(--border-strong)"),
                  display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                }}>
                  {page.included && <span style={{ color: "white", fontSize: 11 }}>✓</span>}
                </div>
              </button>
            ))}
            <button onClick={() => setShowCustomDialog({ kind: "page", section: sectionIdx })} style={{
              padding: "10px 12px", fontSize: 12, color: "var(--gold)",
              border: "1px dashed var(--gold)", borderRadius: 6,
              background: "transparent", textAlign: "center",
            }}>
              + Add Custom Page to {section.label}
            </button>
          </div>
        </div>
      ))}

      {showCustomDialog && (
        <CustomDialog
          kind={showCustomDialog.kind || showCustomDialog}
          sectionIdx={showCustomDialog.section}
          onClose={() => setShowCustomDialog(null)}
          onAddPage={addCustomPage}
          onAddSection={addCustomSection}
        />
      )}
    </div>
  );
};

const CustomDialog = ({ kind, sectionIdx, onClose, onAddPage, onAddSection }) => {
  const [title, setTitle] = useState("");
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(10, 22, 40, 0.6)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: 10, padding: 28, maxWidth: 480, width: "100%" }}>
        <div className="font-mono uppercase" style={{ fontSize: 10, color: "var(--gold)", marginBottom: 6 }}>{kind === "section" ? "Add Custom Section" : "Add Custom Page"}</div>
        <h3 className="font-display" style={{ fontSize: 22, color: "var(--navy)", marginBottom: 12 }}>
          {kind === "section" ? "What do you want to call the new section?" : "What do you want to call the new page?"}
        </h3>
        <p style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 16 }}>
          {kind === "section" ? "Examples: 'Smart Home', 'Wine Cellar', 'Family Heirlooms'" : "Examples: 'Holiday Décor Storage', 'Pool House', 'Master Closet System'"}
        </p>
        <input
          autoFocus
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          placeholder={kind === "section" ? "Section name..." : "Page name..."}
          style={{ width: "100%", padding: "12px 14px", fontSize: 14, border: "1px solid var(--border)", borderRadius: 6, marginBottom: 16 }}
        />
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
          <button onClick={onClose} className="btn btn-ghost btn-sm">Cancel</button>
          <button
            disabled={!title.trim()}
            onClick={() => {
              if (kind === "section") onAddSection(title.trim());
              else onAddPage(sectionIdx ?? 0, title.trim());
            }}
            className="btn btn-gold btn-sm"
            style={{ opacity: title.trim() ? 1 : 0.5 }}
          >
            Create
          </button>
        </div>
      </div>
    </div>
  );
};

// Concierge panel with active chat thread + input field per [v2.15]
const ConciergePanel = ({ onClose }) => {
  const [messages, setMessages] = useState([
    { from: "concierge", text: "I know everything in your HCR. I can answer questions, pull up records, and take action. Try one of these — or type your own question." },
  ]);
  const [input, setInput] = useState("");
  const demoPrompts = [
    "Schedule the chimney sweep this fall",
    "Pay the AK Renovations draw invoice that came in",
    "What paint is on the dining room walls?",
    "Pull up the photo of the furnace serial plate",
    "Tell Adam I want to start planning the basement gym",
  ];

  const sendMessage = (text) => {
    const userMsg = { from: "user", text };
    setMessages([...messages, userMsg]);
    setInput("");
    setTimeout(() => {
      let response = "I'll handle that. Confirming...";
      if (text.toLowerCase().includes("chimney")) response = "I'll book Brooks Chimney for the second week of September — they're your usual provider. I'll add it to your calendar, send you a reminder 7 days out, and bill it through your Concierge subscription. Confirm?";
      else if (text.toLowerCase().includes("paint")) response = "Your dining room walls are Benjamin Moore Revere Pewter HC-172, eggshell finish, two coats. Last documented in your April 2026 walkthrough. The trim is Simply White OC-117. Want me to pull up the photo?";
      else if (text.toLowerCase().includes("invoice") || text.toLowerCase().includes("pay")) response = "AK Renovations draw invoice #2026-0418 for $12,400 came in for the home gym buildout. Approved by Adam on April 23. I can pay it through your linked account or schedule for end-of-month. Which would you prefer?";
      else if (text.toLowerCase().includes("serial")) response = "Pulling up your furnace serial plate now. Lennox SLP99V-090, Serial 5818H45821, Manufactured August 2009, 90,000 BTU input. Photo from your April 2026 walkthrough. Anything else you need from this record?";
      else if (text.toLowerCase().includes("basement") || text.toLowerCase().includes("gym")) response = "Done — I've sent Adam a message: 'Mark and Jennifer want to start planning the basement gym expansion. Want to schedule a design conversation?' He'll get back to you within 1 business day, usually same-day.";
      setMessages(m => [...m, { from: "concierge", text: response }]);
    }, 800);
  };

  return (
    <div style={{ position: "fixed", top: 56, right: 0, bottom: 0, width: 420, maxWidth: "100%", background: "white", boxShadow: "-4px 0 24px rgba(0,0,0,0.15)", zIndex: 60, display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "16px 20px", borderBottom: "1px solid var(--border)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div className="font-mono uppercase" style={{ fontSize: 10, color: "var(--gold)" }}>Your Concierge</div>
          <div className="font-display" style={{ fontSize: 18, color: "var(--navy)", marginTop: 2 }}>Trained on the Caldwell home</div>
        </div>
        <button onClick={onClose} style={{ fontSize: 18, color: "var(--text-muted)", padding: 4 }}>×</button>
      </div>
      <div style={{ flex: 1, overflow: "auto", padding: 20 }} className="scrollbar-thin">
        {messages.map((m, i) => (
          <div key={i} style={{ marginBottom: 12 }}>
            {m.from === "user" ? (
              <div style={{ background: "var(--cream-light)", padding: "10px 14px", borderRadius: 12, fontSize: 13, color: "var(--navy)", marginLeft: 40 }}>
                <div className="font-mono uppercase" style={{ fontSize: 9, color: "var(--text-muted)", marginBottom: 3 }}>You</div>
                {m.text}
              </div>
            ) : (
              <div style={{ background: "var(--navy)", color: "var(--cream)", padding: "12px 14px", borderRadius: 12, fontSize: 13, lineHeight: 1.6, marginRight: 40 }}>
                <div className="font-mono uppercase" style={{ fontSize: 9, color: "var(--gold)", marginBottom: 3 }}>Concierge</div>
                {m.text}
              </div>
            )}
          </div>
        ))}
        {messages.length === 1 && (
          <div style={{ marginTop: 14 }}>
            <div className="font-mono uppercase" style={{ fontSize: 9, color: "var(--text-muted)", marginBottom: 6 }}>Try one of these</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {demoPrompts.map((p, i) => (
                <button key={i} onClick={() => sendMessage(p)} style={{
                  textAlign: "left", padding: "10px 12px", borderRadius: 6, fontSize: 13,
                  background: "var(--cream-light)", border: "1px solid var(--border)", color: "var(--text)",
                }}>"{p}"</button>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{ padding: 14, borderTop: "1px solid var(--border)", display: "flex", gap: 8 }}>
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && input.trim()) sendMessage(input.trim()); }}
          placeholder="Type your question..."
          style={{ flex: 1, padding: "10px 14px", fontSize: 13, border: "1px solid var(--border)", borderRadius: 6 }}
        />
        <button onClick={() => input.trim() && sendMessage(input.trim())} className="btn btn-gold btn-sm">Send</button>
      </div>
    </div>
  );
};
